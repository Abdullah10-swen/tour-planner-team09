# Lokale Secrets: application-local.properties (optional classpath) — zuerst importieren.
spring.config.import=optional:classpath:application-local.properties

spring.application.name=tourplanner
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/tourplanner}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tourplanner}
# Passwort: nur in application-local.properties (spring.datasource.password=…) oder Umgebung SPRING_DATASOURCE_PASSWORD
# — nicht in dieser Datei setzen, sonst überschreibt es die lokale Datei.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# OpenRouteService: NICHT hier openrouteservice.api.key setzen (leer mit ${…:}) — das würde die importierte
# application-local.properties überschreiben. Schlüssel nur in application-local.properties oder Umgebungsvariable:
# OPENROUTESERVICE_API_KEY (Standard Relaxed Binding). Basis-URL optional: OPENROUTESERVICE_BASE_URL

# Image upload directory – override with TOUR_IMAGE_UPLOAD_DIR env variable or application-local.properties
tour.image.upload-dir=${TOUR_IMAGE_UPLOAD_DIR:./uploads}

# JWT – secret must be >= 32 characters (256 bit). Set JWT_SECRET env or in application-local.properties.
jwt.secret=${JWT_SECRET:tourplanner-dev-secret-key-change-in-production-min-256-bit!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Geocoding focus point: Suchergebnisse werden zu diesem Punkt hin gewichtet (kein harter Filter).
# Standard: Wien, Österreich — österreichische Adressen erscheinen dadurch zuerst.
openrouteservice.geocode.focus.lat=48.2082
openrouteservice.geocode.focus.lon=16.3738
